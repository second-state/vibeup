# GitHub Pages:发布 webui 向导页(web/index.html → /vibeup/webui/)。
# 页面只有单文件,无需构建;webui/ 子目录对齐 vibeup webui 打印的配对 URL。
# 首次使用需在 repo Settings → Pages 把 Source 设为 GitHub Actions。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage webui/ for Pages
        run: mkdir -p site/webui && cp web/index.html site/webui/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
