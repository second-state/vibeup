[package]
name = "vibeup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.12"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28"
dialoguer = "0.11"
dirs = "7.0.0"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"
